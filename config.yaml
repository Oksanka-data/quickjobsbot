location:
  home: "SW16"
  radius_miles: 5

employment:
  - "part-time"

transport:
  max_bus_minutes: 60
  max_walk_minutes: 40

salary:
  highlight_from: 14
  priority_from: 15

exclude_keywords:
  - cleaner
  - cleaning
  - carer
  - care assistant
  - support worker
  - healthcare assistant
  - chef
  - head chef
  - sous chef
  - cook
  - kitchen porter
  - volunteer
  - funeral
  - delivery
  - driver
  - book keeper
  - bookkeeper
  - english teacher
  - payroll manager
  - paid emails
  - cashback
  - mortgage
  - broker
  - copywriter
  - safeguarding
  - nurse
  - computer technician
  - hr specialist
  - paid emails
  - no experience required

agents:

  tech:
    enabled: true
    emoji: "💻"
    title: "TECH"
    radius_miles: 15        # для технічних вакансій шукаємо ширше
    remote: true            # плюс окремий пошук віддалених вакансій по всій Британії
    # Пошук Reed шукає слова і в тексті оголошення, тому без цього фільтра в TECH
    # потрапляють звичайні вакансії. Назва посади МАЄ містити одне зі слів нижче:
    title_match:
      - website
      - web
      - wordpress
      - shopify
      - ppc
      - google ads
      - paid media
      - paid social
      - paid search
      - seo
      - digital marketing
      - ecommerce
      - e-commerce
    # ...і НЕ містити жодного зі слів нижче:
    title_exclude:
      - sales assistant
      - customer assistant
      - retail assistant
      - bookkeeper
      - book keeper
      - accountant
      - accounts
      - cashier
      - driver
    keywords:
      - website administrator
      - web administrator
      - website manager
      - wordpress
      - shopify
      - ppc specialist
      - ppc executive
      - google ads
      - paid media
      - paid social
      - seo executive
      - digital marketing assistant
      - ecommerce assistant

  shops:
    enabled: true
    emoji: "🛒"
    title: "SUPERMARKETS"

    keywords:
      - customer assistant
      - sales assistant
      - retail assistant
      - cashier
      - checkout assistant
      - customer advisor
      - store colleague

